<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtakuVerse | Manga Store - WDD 131 Dynamic Web Fundamentals - Orlando Vivas</title>
    <meta name="description"
        content="Browse, filter, and search your favorite manga titles in the OtakuVerse Manga Catalog. Add volumes directly to your queue.">
    <meta name="author" content="Orlando Vivas">

    <!-- Google Fonts Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="styles/base.css">

    <!-- JavaScript Files -->
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/manga.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo-container">
                <p class="eyebrow">Explore &middot; Backlog</p>
                <h1>Otaku<span class="tilt">Verse</span></h1>
                <p class="tagline">The ultimate anime and video game hub.</p>
                <span id="course-title">WDD 131 - Dynamic Web Fundamentals</span>
            </a>

            <button id="menu-btn" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="site-nav">&#9776;</button>
            <nav id="site-nav" aria-label="Primary Navigation">
                <a href="index.html">Home</a>
                <a href="manga.html" class="active">Manga Store</a>
                <a href="tracker.html" class="site-nav-cta">My Watchlist!</a>
                <a href="siteplan.html">Site Plan</a>
            </nav>
        </div>
    </header>

    <!-- Explorer Search & Controls Header -->
    <header class="explorer-header catalog-controls">
        <form id="form" class="search-form">
            <input type="text" autocomplete="off" id="search" placeholder="Search Manga..." class="search">
        </form>

        <div class="sort-wrapper">
            <label for="sort-select">Sort By:</label>
            <select id="sort-select" class="sort-dropdown">
                <option value="default">Featured</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="rating-desc">Top Rated</option>
            </select>
        </div>
    </header>

    <!-- Filter Bar Container -->
    <div class="filter-bar-container">
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-genre="all">All Volumes</button>
            <button class="filter-btn" data-genre="action">Action</button>
            <button class="filter-btn" data-genre="isekai">Isekai</button>
            <button class="filter-btn" data-genre="sci-fi">Sci-Fi</button>
            <button class="filter-btn" data-genre="fantasy">Fantasy</button>
        </div>
    </div>

    <!-- Main dynamic manga grid wrapper -->
    <main id="main" class="catalog-grid">
        <!-- Manga volumes render dynamically from directory.js -->
    </main>

    <!-- Simple notification toast for adding items -->
    <div id="toast" class="toast" aria-live="polite">Added to Watchlist!</div>

    <footer class="site-footer">
        <p>&copy; <span id="currentyear"></span> | Orlando Vivas | Guatemala City, Guatemala | <a href="https://github.com/vivaseliezer/wdd131" target="_blank" rel="noopener" class="footer-link">GitHub Repository</a></p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
