<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Orlando Vivas">
    <meta name="description" content="Submit a review for one of our featured products, including a star rating, installation date, and a helpful feature checklist.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/products.js" defer></script>
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
        <p class="subtitle">Tell us what you think about your recent purchase</p>
    </header>

    <main>
        <form class="review-form" action="review.html" method="get">
            <p class="required-note"><span class="required" aria-hidden="true">*</span> indicates a required field</p>

            <div class="form-group">
                <label for="productName">Product Name <span class="required" aria-hidden="true">*</span><span class="sr-only"> (required)</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Overall Rating <span class="required" aria-hidden="true">*</span><span class="sr-only"> (required)</span></legend>
                <div class="star-rating">
                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1"><span aria-hidden="true">&starf;</span><span class="sr-only">1 star</span></label>

                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2"><span aria-hidden="true">&starf;</span><span class="sr-only">2 stars</span></label>

                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3"><span aria-hidden="true">&starf;</span><span class="sr-only">3 stars</span></label>

                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4"><span aria-hidden="true">&starf;</span><span class="sr-only">4 stars</span></label>

                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5"><span aria-hidden="true">&starf;</span><span class="sr-only">5 stars</span></label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation <span class="required" aria-hidden="true">*</span><span class="sr-only"> (required)</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Useful Features <span class="hint">(check all that apply)</span></legend>
                <div class="checkbox-list">
                    <div class="checkbox-item">
                        <input type="checkbox" id="featureInstall" name="features" value="Easy Installation">
                        <label for="featureInstall">Easy Installation</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="featureQuality" name="features" value="High Quality">
                        <label for="featureQuality">High Quality</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="featurePerformance" name="features" value="Great Performance">
                        <label for="featurePerformance">Great Performance</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="featureValue" name="features" value="Good Value">
                        <label for="featureValue">Good Value</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="featureDurable" name="features" value="Durable">
                        <label for="featureDurable">Durable</label>
                    </div>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="review">Written Review <span class="hint">(optional)</span></label>
                <textarea id="review" name="review" rows="5" placeholder="Share details about your experience with this product..."></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name <span class="hint">(optional)</span></label>
                <input type="text" id="userName" name="userName" placeholder="e.g. Marty McFly">
            </div>

            <div class="form-group">
                <input type="submit" value="Submit Review">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> | Orlando Vivas | Guatemala</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
